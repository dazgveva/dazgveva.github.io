<script>
/* ============================== DATA ============================== */
const INSURERS = {
  kolkheti:  { name: 'კოლხეთი ჯგუფი',    color: '#047857' },
  iberia:    { name: 'იბერია დაზღვევა',  color: '#1d4ed8' },
  mtkvari:   { name: 'მტკვარი დაზღვევა', color: '#0e7490' },
  kazbegi:   { name: 'ყაზბეგი დაზღვევა', color: '#b45309' },
  argonauti: { name: 'არგონავტი',         color: '#7c3aed' },
};
const CATS = [
  { id: 'max',     label: 'მაქსიმალური დაფარვა', short: 'მაქს' },
  { id: 'limited', label: 'ლიმიტირებული დაფარვა', short: 'ლიმიტირებული' },
  { id: 'cheap',   label: 'იაფი შეთავაზება',      short: 'იაფი' },
];
const COVERAGE = [['collision','ავარია'],['theft','ქურდობა'],['nature','სტიქია'],['glass','მინები'],['towing','ევაკუატორი']];
const FULL = COVERAGE.map(c => c[0]);
const DECLINE = { not_offered: 'არ სთავაზობს', manual_underwriting: 'საჭიროებს ინდივიდუალურ შეფასებას' };
const CHANNELS = [
  { id: 'call',     label: 'სატელეფონო ზარი', icon: 'phone',          color: '#18181b' },
  { id: 'whatsapp', label: 'WhatsApp',        icon: 'message-circle', color: '#16a34a' },
  { id: 'viber',    label: 'Viber',           icon: 'phone-call',     color: '#7c3aed' },
  { id: 'telegram', label: 'Telegram',        icon: 'send',           color: '#0284c7' },
];
const VEHICLE = { make: 'Toyota', model: 'Camry', year: 2018, value: 52000 };
const TIMEOUT_AT = 6.5;
const o = (premium, deductible, cov) => ({ premium, deductible, sum: VEHICLE.value, cov });
const BASIC = ['collision','theft'];
const CORE = ['collision','theft','nature'];

/* Insurer agent responses per demo mode. t = seconds after the auction start. */
const DATASETS = {
  normal: [
    { id: 'kolkheti', t: 2.4, offers: { max: o(2640,300,FULL), limited: o(1890,500,[...CORE,'glass']), cheap: o(1240,1000,BASIC) } },
    { id: 'iberia',   t: 3.1, offers: { limited: o(1980,500,CORE), cheap: o(980,1000,BASIC) }, declines: { max: 'not_offered' } },
    { id: 'mtkvari',  t: 4.0, offers: { max: o(2790,300,FULL), limited: o(1720,500,CORE), cheap: o(1090,1200,BASIC) } },
    { id: 'kazbegi',  t: 5.2, offers: { cheap: o(1060,800,BASIC) }, declines: { max: 'manual_underwriting', limited: 'not_offered' } },
    { id: 'argonauti', timeout: true },
  ],
  surprises: [
    { id: 'kolkheti', t: 2.2, offers: { max: o(2640,300,FULL), cheap: o(1240,1000,BASIC) }, declines: { limited: 'not_offered' } },
    { id: 'iberia',   t: 3.4, offers: { cheap: o(980,1000,BASIC) }, declines: { max: 'not_offered', limited: 'not_offered' } },
    { id: 'kazbegi',  t: 4.6, offers: { cheap: o(1060,800,BASIC) }, declines: { max: 'manual_underwriting', limited: 'not_offered' } },
    { id: 'mtkvari',  timeout: true },
    { id: 'argonauti', timeout: true },
  ],
  same: [
    { id: 'kolkheti', t: 2.4, offers: { max: o(2640,300,FULL), limited: o(1650,500,CORE), cheap: o(1240,1000,BASIC) } },
    { id: 'iberia',   t: 3.1, offers: { limited: o(1980,500,CORE), cheap: o(980,1000,BASIC) }, declines: { max: 'not_offered' } },
    { id: 'mtkvari',  t: 4.0, offers: { max: o(2790,300,FULL), limited: o(1720,500,CORE), cheap: o(1090,1200,BASIC) } },
    { id: 'kazbegi',  t: 5.2, offers: { cheap: o(1060,800,BASIC) }, declines: { max: 'manual_underwriting', limited: 'not_offered' } },
    { id: 'argonauti', timeout: true },
  ],
};
const MODES = [
  { id: 'normal',    label: 'ჩვეულებრივი' },
  { id: 'surprises', label: 'მოულოდნელობებით' },
  { id: 'same',      label: 'ერთი სადაზღვევო, ორი პაკეტი' },
];

/* ============================== STATE ============================== */
const S = {
  screen: 'home', front: null, back: null, uploadError: null,
  processing: false, scanError: false, failScan: false,
  phone: '', phoneTouched: false, channels: [], preferred: null,
  mode: 'normal', results: null, selected: new Set(), consent: false,
  navOpen: false,
  insurer: 'kolkheti', leadId: null, filter: 'all', modal: null, offset: 0, leads: [], calls: [], lastSent: [],
  meta: {}, users: [], searches: [], searchId: null, admFilter: 'all', admInsurer: 'all', insTab: 'active', editIns: null, form: null,
  session: null, login: { u: '', p: '', error: null, hint: null }, pw: {},
};
let timers = [];

/* ============================== HELPERS ============================== */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const money = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₾';
const icons = () => window.lucide && lucide.createIcons();
const catById = id => CATS.find(c => c.id === id);
const chById = id => CHANNELS.find(c => c.id === id);
const fmtPhone = d => [d.slice(0,3), d.slice(3,5), d.slice(5,7), d.slice(7,9)].filter(Boolean).join(' ');
const phoneValid = () => /^5\d{8}$/.test(S.phone);
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };

function toast(text, icon = 'info', action) {
  const el = document.createElement('div');
  el.className = 'pointer-events-auto fade-in flex max-w-md items-start gap-2 rounded-lg border border-zinc-200 bg-white px-4 py-3 text-sm shadow-lg';
  el.innerHTML = `<i data-lucide="${icon}" class="mt-0.5 h-4 w-4 shrink-0"></i><span>${text}</span>` +
    (action ? `<button data-act="${action.act}" data-id="${action.id || ''}" data-msg="${action.msg || ''}" class="ml-2 shrink-0 font-semibold underline underline-offset-2">${action.label}</button>` : '');
  $('#toasts').appendChild(el); icons();
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, action ? 7000 : 4200);
}

function go(screen) {
  clearTimers();
  S.screen = screen;
  render();
  window.scrollTo({ top: 0, behavior: 'instant' });
  if (screen === 'auction') startAuction();
}

/* Sample tech-passport images (SVG) so the demo works without real photos */
function sampleCard(side) {
  const rows = side === 'front'
    ? [['A','AA-123-BB'],['E','4T1B11HK5JU000000'],['D.1','TOYOTA'],['D.3','CAMRY'],['B','2018'],['R','თეთრი / WHITE']]
    : [['C.1.1','ბერიძე / BERIDZE'],['C.1.2','გიორგი / GIORGI'],['პ/ნ','01001012345'],['C.1.3','თბილისი, ნიმუშის ქ. 1'],['P.1','2494 სმ³'],['P.3','ბენზინი / PETROL']];
  const lines = rows.map((r, i) => `<text x="60" y="${200 + i*50}" font-size="22" fill="#52525b" font-family="sans-serif">${r[0]}</text><text x="170" y="${200 + i*50}" font-size="26" fill="#18181b" font-family="monospace" font-weight="600">${r[1]}</text>`).join('');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="856" height="540" viewBox="0 0 856 540">
    <rect width="856" height="540" rx="32" fill="#e8f1ec"/><rect x="16" y="16" width="824" height="508" rx="24" fill="none" stroke="#9fc5b0" stroke-width="3"/>
    <text x="60" y="80" font-size="30" font-weight="700" fill="#14532d" font-family="sans-serif">საქართველო · GEORGIA</text>
    <text x="60" y="120" font-size="20" fill="#166534" font-family="sans-serif">სატრანსპორტო საშუალების რეგისტრაციის მოწმობა · ${side === 'front' ? 'წინა მხარე' : 'უკანა მხარე'}</text>
    ${lines}
    <text x="796" y="500" text-anchor="end" font-size="18" fill="#71717a" font-family="sans-serif">ნიმუში · SAMPLE</text></svg>`;
  return { url: 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg), name: `tech-passport-${side}.svg` };
}

function prefill() {
  S.front = sampleCard('front'); S.back = sampleCard('back');
  S.uploadError = null;
  S.phone = '599123456'; S.channels = ['whatsapp', 'call']; S.preferred = 'whatsapp';
}

function resetAll() {
  clearTimers();
  Object.assign(S, { front: null, back: null, uploadError: null, processing: false, scanError: false,
    phone: '', phoneTouched: false, channels: [], preferred: null, results: null, selected: new Set(), consent: false });
}

/* ============================== AUCTION LOGIC ============================== */
/* Our AI's pick per category: cheapest premium for "cheap"; premium + 0.3 × deductible for the others. */
function pickBest(ds) {
  const res = {};
  for (const cat of CATS) {
    const cands = ds.filter(r => !r.timeout && r.offers && r.offers[cat.id]).map(r => ({ insurer: r.id, ...r.offers[cat.id] }));
    if (!cands.length) { res[cat.id] = null; continue; }
    const score = x => cat.id === 'cheap' ? x.premium : x.premium + 0.3 * x.deductible;
    cands.sort((a, b) => score(a) - score(b));
    const w = cands[0], next = cands[1];
    let why;
    if (!next) why = 'ერთადერთი შეთავაზება ამ კატეგორიაში';
    else {
      const diff = `სხვაობა მომდევნო შეთავაზებასთან: ${money(next.premium - w.premium)}`;
      why = cat.id === 'cheap' ? `ყველაზე დაბალი წლიური პრემია · ${diff}`
          : cat.id === 'max'   ? `სრული დაფარვა საუკეთესო ფასად, ფრანშიზა ${money(w.deductible)} · ${diff}`
          :                      `ძირითადი რისკები საუკეთესო ფასად · ${diff}`;
    }
    res[cat.id] = { ...w, why, count: cands.length };
  }
  return res;
}

function buildLog(ds, results) {
  const L = [
    { t: 0.0, kind: 'ok', text: 'ავტომობილის მონაცემები ანონიმიზებულია — პირადი ინფორმაცია არ გადაეცემა' },
    { t: 0.6, kind: 'ok', text: 'საბაზრო ღირებულება შეფასდა' },
    { t: 1.0, kind: 'info', text: `მოთხოვნა გაეგზავნა ${ds.length} სადაზღვევო კომპანიას` },
  ];
  let total = 0;
  for (const r of ds) {
    const name = INSURERS[r.id].name;
    if (r.timeout) { L.push({ t: TIMEOUT_AT, kind: 'timeout', insurer: r.id, name, text: `${name}: პასუხი დროულად ვერ მივიღეთ` }); continue; }
    const n = Object.keys(r.offers || {}).length; total += n;
    const dec = Object.entries(r.declines || {}).map(([c, why]) => ` · „${catById(c).short}“ — ${DECLINE[why]}`).join('');
    L.push({ t: r.t, kind: n ? 'ok' : 'warn', insurer: r.id, name, count: n,
      text: n ? `${name}: მიღებულია ${n} შეთავაზება${dec}` : `${name}: შეთავაზება არ მოუწოდებია${dec}` });
  }
  L.sort((a, b) => a.t - b.t);
  const last = Math.max(...L.map(l => l.t));
  L.push({ t: last + 0.3, kind: 'spin', id: 'compare', text: `AI აგენტი ადარებს ${total} შეთავაზებას…` });
  let t = last + 0.9;
  for (const c of CATS) if (!results[c.id]) { L.push({ t, kind: 'warn', text: `„${c.short}“: ამ კატეგორიაში შეთავაზება ვერ მოიძებნა` }); t += 0.2; }
  L.push({ t: Math.max(t, last + 1.4), kind: 'done', text: 'შერჩეულია საუკეთესო შეთავაზებები' });
  return L;
}

const LOG_ICON = {
  ok: ['circle-check', 'text-emerald-600'], info: ['send', 'text-zinc-500'], timeout: ['clock', 'text-amber-600'],
  warn: ['circle-x', 'text-rose-600'], spin: ['loader-circle', 'text-zinc-500 animate-spin'], done: ['sparkles', 'text-zinc-900'],
};

function startAuction() {
  const search = makeClientSearch(auctionDataset());
  S.results = search.results;
  S.selected = new Set(); S.consent = false;
  const log = search.log;
  const total = log[log.length - 1].t;
  const list = $('#log'), bar = $('#bar');
  requestAnimationFrame(() => { bar.style.transition = `width ${total}s linear`; bar.style.width = '100%'; });
  for (const line of log) {
    timers.push(setTimeout(() => {
      const [ic, cls] = LOG_ICON[line.kind];
      const li = document.createElement('li');
      li.className = 'fade-in flex items-start gap-3 py-2';
      if (line.id) li.id = 'log-' + line.id;
      li.innerHTML = `<span class="w-12 shrink-0 pt-0.5 text-right font-mono text-xs text-zinc-400">${line.t.toFixed(1)} წმ</span>
        <i data-lucide="${ic}" class="mt-0.5 h-4 w-4 shrink-0 ${cls}"></i><span class="text-sm ${line.kind === 'done' ? 'font-semibold' : ''}">${esc(line.text)}</span>`;
      list.appendChild(li);
      if (line.insurer) updateChip(line.insurer, line.kind, line.count);
      if (line.kind === 'done') {
        const cmp = $('#log-compare i, #log-compare svg');
        if (cmp) cmp.outerHTML = '<i data-lucide="circle-check" class="mt-0.5 h-4 w-4 shrink-0 text-emerald-600"></i>';
        $('#auction-title').textContent = 'აუქციონი დასრულდა';
        timers.push(setTimeout(() => go('offers'), 1200));
      }
      icons();
      list.parentElement.scrollTop = list.parentElement.scrollHeight;
    }, line.t * 1000));
  }
}

function updateChip(id, kind, count) {
  const el = $(`#chip-${id}`); if (!el) return;
  const map = { ok: ['circle-check', 'text-emerald-600', `${count} შეთავაზება`], warn: ['circle-x', 'text-rose-600', 'უარი'], timeout: ['clock', 'text-amber-600', 'დრო ამოიწურა'] };
  const [ic, cls, txt] = map[kind];
  el.querySelector('.st').innerHTML = `<i data-lucide="${ic}" class="h-3.5 w-3.5 ${cls}"></i><span>${txt}</span>`;
}

/* ============================== VIEWS ============================== */
function stepper(active) {
  const steps = ['ტექპასპორტი', 'კონტაქტი', 'აუქციონი', 'შეთავაზებები'];
  return `<ol class="flex items-center gap-1.5 text-xs sm:gap-2 sm:text-sm">${steps.map((s, i) => {
    const done = i < active, cur = i === active;
    const dot = done ? `<span class="grid h-6 w-6 shrink-0 place-items-center rounded-full bg-zinc-900 text-white"><i data-lucide="check" class="h-3.5 w-3.5"></i></span>`
      : `<span class="grid h-6 w-6 shrink-0 place-items-center rounded-full ${cur ? 'bg-zinc-900 text-white' : 'border border-zinc-300 text-zinc-500'} text-xs font-semibold">${i + 1}</span>`;

const HOUR = 3600e3, DAY = 24 * HOUR;

const pad = n => String(n).padStart(2, '0');
const fmtDate = t => { const d = new Date(t); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtLeft = ms => { if (ms <= 0) return '—'; const h = Math.floor(ms / HOUR), m = Math.floor(ms % HOUR / 60000); return h ? `${h} სთ ${m} წთ` : `${m} წთ`; };
const initials = c => `${c.first[0]}. ${c.last[0]}.`;
const maskName = c => `${c.first[0]}${'*'.repeat(c.first.length - 1)} ${c.last[0]}${'*'.repeat(c.last.length - 1)}`;
const leadById = id => S.leads.find(l => l.id === id);
const msgApp = l => l.client.preferred === 'call' ? 'sms' : l.client.preferred;
const msgChannel = l => l.client.preferred === 'call' ? 'SMS' : chById(l.client.preferred).label;

  new: ['ახალი', 'bg-sky-50 text-sky-700 ring-sky-200'],

/* Spread the demo wins so every insurer's dashboard has a few requests */
const SEED_FAVOR = { 7: { cheap: 'iberia' } };
function seedDataset(i, value) {
  return Object.entries(AGENT_PROFILE).map(([id, pr], k) => {
    if (id === 'argonauti' && i % 2 === 0) return { id, timeout: true };
    const offers = {};
    CATS.forEach((c, ci) => {
      if (!pr.f[c.id]) return;
      const jitter = (((i + 1) * 31 + k * 17 + ci * 7) % 11 - 5) / 100 - (SEED_FAVOR[i] && SEED_FAVOR[i][c.id] === id ? 0.1 : 0);
      offers[c.id] = { premium: Math.round(value * PKG_RULES[c.id][0] * pr.f[c.id] * (1 + jitter) / 10) * 10,
        deductible: pr.ded[c.id], sum: value, cov: (pr.cov && pr.cov[c.id]) || STD_COV[c.id] };
    });
    return { id, t: +(pr.t + ((i + k) % 4) * 0.2).toFixed(1), offers, declines: pr.dec ? { ...pr.dec } : undefined };
  });
}

function recordCalls(s) {
  s.ds.forEach(r => S.calls.push({ insurer: r.id, req: s.id, at: s.at + (r.timeout ? TIMEOUT_AT : r.t) * 1000, timeout: !!r.timeout,
    latency: r.timeout ? 5000 : Math.round((r.t - 1) * 1000), offers: r.timeout ? 0 : Object.keys(r.offers || {}).length, declines: Object.keys(r.declines || {}).length }));
}

function seedData() {
  const base = Date.now(), searches = [], leads = [];
  SEED_SEARCHES.forEach(([ago, chosen, status, rev], i) => {
    const car = SEED_CARS[(i * 3) % SEED_CARS.length], p = SEED_PEOPLE[i % SEED_PEOPLE.length];
    const ds = seedDataset(i, car.value), results = pickBest(ds);
    const s = { id: 'Q-' + (++callSeq), at: base - ago * HOUR, client: { ...p, channels: [...p.channels] }, vehicle: car, ds, results,
      log: buildLog(ds, results), selected: chosen.filter(c => results[c]), leadIds: [] };
    const groups = {};
    s.selected.forEach(c => (groups[results[c].insurer] ||= []).push(c));
    Object.entries(groups).forEach(([ins, cats], j) => {
      const st = Array.isArray(status) ? status[j] || status[status.length - 1] : status;
      const sentAt = s.at + 90e3;
      const l = { id: 'R-' + (++leadSeq), searchId: s.id, insurer: ins, sentAt, client: s.client, vehicle: car, status: st, messages: [],
        packages: cats.map(c => { const w = results[c]; return { cat: c, premium: w.premium, sum: w.sum, deductible: w.deductible, cov: w.cov }; }) };
      if (st === 'contact_requested') { l.revealedAt = sentAt + rev * HOUR; l.messages.push({ type: 'reveal', at: l.revealedAt }); }
      if (st === 'expired') { l.expiredAt = sentAt + DAY; l.messages.push({ type: 'expiry', at: l.expiredAt }); }
      leads.push(l); s.leadIds.push(l.id);
    });
    searches.push(s);
  });
  return { searches, leads };
}

function initData() {
  const d = seedData();
  S.searches = d.searches; S.leads = d.leads; S.calls = [];
  S.searches.forEach(recordCalls);
}

/* One request per insurer; several packages from the same insurer go into the same request. */
function createClientLeads() {
  const groups = {};
  for (const c of CATS) if (S.selected.has(c.id)) {
    const w = S.results[c.id];
    (groups[w.insurer] ||= []).push({ cat: c.id, premium: w.premium, sum: w.sum, deductible: w.deductible, cov: w.cov });
  }
  const t = now(), srch = searchById(S.searchId);
  for (const [ins, packages] of Object.entries(groups)) {
    const l = { id: 'R-' + (++leadSeq), searchId: srch && srch.id, insurer: ins, sentAt: t, fromClient: true, vehicle: CLIENT_VEHICLE, packages, status: 'new', messages: [],
      client: srch ? srch.client : { ...DEMO_CLIENT, phone: S.phone, channels: [...S.channels], preferred: S.preferred } };
    S.leads.unshift(l);
    if (srch) srch.leadIds.push(l.id);
  }
  if (srch) srch.selected = CATS.map(c => c.id).filter(c => S.selected.has(c));
  S.lastSent = Object.keys(groups);
}

function expireCheck() {
  const t = now(); let n = 0;
  for (const l of S.leads) if (l.status === 'new' && t >= l.sentAt + DAY) {
    l.status = 'expired'; l.expiredAt = l.sentAt + DAY; l.messages.push({ type: 'expiry', at: l.expiredAt }); n++;
  }
  return n;
}

function revealLead(l) {
  l.status = 'contact_requested'; l.revealedAt = now();
  l.messages.push({ type: 'reveal', at: l.revealedAt });

  if (!/^(ins|adm)/.test(S.screen)) return;

  if (n) { render(); toast(`${n} მოთხოვნას ვადა გაუვიდა. კლიენტებს ეცნობათ.`, 'clock'); return; }

function auctionDataset(mode = S.mode) {
  const ds = DATASETS[mode].filter(r => isActive(r.id));

    const offers = {};
    CATS.forEach(c => offers[c.id] = { premium: Math.round(VEHICLE.value * PKG_RULES[c.id][0] * (1.06 + k * 0.02) / 10) * 10,

function bindDynamic() {
  document.querySelectorAll('[data-drop]').forEach(z => {
    z.addEventListener('dragover', e => { e.preventDefault(); z.classList.add('ring-2', 'ring-sky-300'); });
    z.addEventListener('dragleave', () => z.classList.remove('ring-2', 'ring-sky-300'));
    z.addEventListener('drop', e => { e.preventDefault(); z.classList.remove('ring-2', 'ring-sky-300'); acceptFiles(e.dataTransfer.files); });
  });
  const ph = $('#phone');
  if (ph) {
    ph.addEventListener('input', () => {
      S.phone = ph.value.replace(/\D/g, '').replace(/^995/, '').slice(0, 9);
      ph.value = fmtPhone(S.phone);
      if (phoneValid()) { $('#phone-err').classList.add('hidden'); ph.classList.remove('border-rose-400'); }
      $('#to-auction').disabled = !(phoneValid() && S.channels.length);
    });
    ph.addEventListener('blur', () => {
      S.phoneTouched = true;
      const bad = S.phone && !phoneValid();
      $('#phone-err').classList.toggle('hidden', !bad);
      ph.classList.toggle('border-rose-400', !!bad);
    });
  }
  const cs = $('#consent');
  if (cs) cs.addEventListener('change', () => { S.consent = cs.checked; $('#send').disabled = !(S.selected.size && S.consent); });
}

/* ============================== UPLOADS ============================== */
const validFile = f => (/^image\/(jpeg|png|heic|heif)$/.test(f.type) || /\.(jpe?g|png|heic|heif)$/i.test(f.name)) && f.size <= 10 * 1024 * 1024;
function setSide(side, val) {
  if (S[side] && S[side].url.startsWith('blob:')) URL.revokeObjectURL(S[side].url);
  S[side] = val;
}
/* Files fill the next empty side (front, then back); a replace targets one side. */
function acceptFiles(files, side) {
  S.uploadError = null; S.scanError = false;
  for (const file of [...files].slice(0, 2)) {
    const target = side || nextSide();
    if (!target) break;
    if (!validFile(file)) { S.uploadError = 'ფაილი ვერ აიტვირთა. გამოიყენეთ JPG, PNG ან HEIC, მაქს. 10 მბ.'; continue; }
    setSide(target, { url: URL.createObjectURL(file), name: file.name });
    if (side) break;
  }
  render();
}
[['in-multi'], ['in-cam'], ['in-front', 'front'], ['in-back', 'back']].forEach(([id, side]) => {
  const inp = $('#' + id);
  inp.addEventListener('change', () => { if (inp.files.length) acceptFiles(inp.files, side); inp.value = ''; });
});

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (el.tagName === 'A') e.preventDefault();
  switch (act) {
    case 'home': go('home'); break;
    case 'anchor': {
      if (S.screen !== 'home') go('home');
      const t = document.getElementById(el.dataset.id);
      if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
      break;
    }
    case 'staff': { const u = S.session && userBy(S.session.username); if (u && !u.mustChange) enterPortal(u); else go('login'); break; }
    case 'privacy': toast('კონფიდენციალურობის პოლიტიკის გვერდი პროტოტიპში არ არის.'); break;
    case 'pick': $(el.dataset.side ? `#in-${el.dataset.side}` : `#in-${el.dataset.src}`).click(); break;
    case 'swap': [S.front, S.back] = [S.back, S.front]; render(); toast('მხარეები გაიცვალა.', 'arrow-left-right'); break;
    case 'remove': {
      const side = el.dataset.side;
      setSide(side, null); S.scanError = false; render(); break;
    }
    case 'scan':
      S.processing = true; S.scanError = false; render();
      timers.push(setTimeout(() => {
        S.processing = false;
        if (S.failScan) { S.scanError = true; render(); } else go('contact');
      }, 2000));
      break;
    case 'pref':
      e.stopPropagation(); S.preferred = el.dataset.id; render(); break;
    case 'toggle-ch': {
      const id = el.dataset.id;
      S.channels = S.channels.includes(id) ? S.channels.filter(c => c !== id) : [...S.channels, id];
      if (!S.channels.includes(S.preferred)) S.preferred = S.channels[0] || null;
      render(); break;
    }
    case 'start-auction': go('auction'); break;
    case 'select': {
      const c = el.dataset.cat;
      S.selected.has(c) ? S.selected.delete(c) : S.selected.add(c);
      render(); break;
    }
    case 'send': createClientLeads(); go('done'); break;
    case 'open-insurer': S.insurer = el.dataset.id; S.filter = 'all'; go('ins-list'); break;
    case 'ins-nav': go(el.dataset.id); break;
    case 'ins-filter': S.filter = el.dataset.id; render(); break;
    case 'ins-logout': S.session = null; go('home'); toast('გამოხვედით სადაზღვევოს პორტალიდან.', 'log-out'); break;
    case 'lead-open': S.leadId = el.dataset.id; go('ins-detail'); break;
    case 'reveal': S.modal = { type: 'confirm', id: el.dataset.id }; renderModal(); break;
    case 'reveal-confirm': {
      const l = leadById(el.dataset.id);
      revealLead(l); S.modal = null; S.leadId = l.id; go('ins-detail');
      toast(`საკონტაქტო ინფორმაცია გაიხსნა. კლიენტს ეცნობა (${msgChannel(l)}).`, 'lock-open', { act: 'phone', id: l.id, msg: 'reveal', label: 'ნახვა' });
      break;
    }
    case 'phone': S.modal = { type: 'phone', id: el.dataset.id, msg: el.dataset.msg }; renderModal(); break;
    case 'modal-close': S.modal = null; renderModal(); break;
    case 'copy':
      try { navigator.clipboard.writeText(el.dataset.text); } catch (_) {}
      toast('დაკოპირდა.', 'copy'); break;
    case 'ff': {
      const h = +el.dataset.h; S.offset += h * HOUR;
      const mine = S.leads.filter(l => l.insurer === S.insurer && l.status === 'new').map(l => l.id);
      const n = expireCheck(), m = mine.filter(id => leadById(id).status === 'expired').length;
      render();
      toast(n ? `დემო დრო: +${h} სთ. ${m || n} მოთხოვნას ვადა გაუვიდა — კლიენტებს ეცნობათ.` : `დემო დრო: +${h} სთ.`, 'clock');
      break;
    }
    case 'demo-reset': {
      const cs = S.searches.filter(x => x.fromClient), cl = S.leads.filter(l => l.fromClient);
      cs.forEach(x => { x.at = Date.now(); }); cl.forEach(l => { l.status = 'new'; l.sentAt = Date.now(); l.messages = []; delete l.revealedAt; delete l.expiredAt; });
      const d = seedData(); S.offset = 0; S.searches = [...cs, ...d.searches]; S.leads = [...cl, ...d.leads]; S.calls = []; S.searches.forEach(recordCalls);
      render(); toast('დემო მონაცემები აღდგა.', 'rotate-ccw'); break;
    }
    case 'restart': S.navOpen = false; resetAll(); go('home'); break;
    case 'nav-open': S.navOpen = true; render(); break;
    case 'nav-close': S.navOpen = false; render(); break;
    case 'scenario': runScenario(el.dataset.id); break;
    case 'mode': S.mode = el.dataset.id; render(); toast(`აუქციონის რეჟიმი: ${MODES.find(m => m.id === S.mode).label}`); break;
    case 'fail-toggle': S.failScan = !S.failScan; render(); break;
    case 'samples':
      S.front = sampleCard('front'); S.back = sampleCard('back'); S.uploadError = null; S.scanError = false;
      S.navOpen = false; if (S.screen !== 'home') go('home'); else render();
      toast('სადემო ტექპასპორტი ჩაისვა.', 'image'); break;
  }
});

document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-act="toggle-ch"]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape' && S.modal) { S.modal = null; renderModal(); return; }
  if (e.key === 'Escape' && S.navOpen) { S.navOpen = false; render(); }
});

document.addEventListener('change', e => {
  if (e.target.matches('[data-change="insurer"]')) {
    S.insurer = e.target.value; S.filter = 'all';
    if (S.screen === 'ins-detail') S.screen = 'ins-list';
    render();
  }
});

initMeta();
initData();
render();
</script>
</body>
</html>
